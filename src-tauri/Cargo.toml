[package]
name = "duskterm"
version = "1.2.1"
description = "跨平台SSH/Telnet/Serial终端，基于Tauri和Rust开发，支持SFTP文件传输"
authors = ["xiaosong <yushan00514@gmail.com>"]
edition = "2021"
license = "MIT"
repository = "https://github.com/dusk-song/duskterm.git"
homepage = "https://github.com/dusk-song/duskterm"
keywords = ["ssh", "terminal", "tauri", "sftp", "telnet", "serial"]
categories = ["command-line-utilities", "network-programming"]


[lib]
name = "duskterm_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tokio = { version = "1", features = [
  "rt-multi-thread",
  "sync",
  "time",
  "net",
  "io-util",
  "macros",
] }
anyhow = "1"
uuid = { version = "1.10.0", features = ["v4"] }
crossbeam-channel = "0.5"
tauri = { version = "2", features = ["protocol-asset"] }
tauri-plugin-opener = "2"
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
aes-gcm = "0.10.3"
base64 = "0.22.1"
sha2 = "0.10.8"
dirs = "6.0.0"
rand = "0.9.2"
tauri-plugin-dialog = "2.6.0"
zeroize = "1.7.0"
serialport = "4.7.0"
encoding_rs = "0.8"
rusqlite = { version = "0.40", features = ["bundled"] }
portable-pty = "0.9.0"
image = { version = "0.25", default-features = false, features = ["png", "jpeg", "webp"] }
webp = "0.3"

alloc-stdlib = "=0.2.2"
brotli-decompressor = "=5.0.1"
russh = { version = "0.62.3", default-features = false, features = ["flate2", "ring", "rsa"] }
russh-sftp = "2.3.0"
zmodem2 = { path = "crates/zmodem2" }
duskterm-terminal-transfer = { path = "crates/terminal-transfer-core" }

[target.'cfg(unix)'.dependencies]
libc = "0.2"

[target.'cfg(windows)'.dependencies]
drag = "2.1.1"
windows = { version = "0.52", features = [
  "implement",
  "Win32_Foundation",
  "Win32_Graphics_Gdi",
  "Win32_Storage_FileSystem",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_DataExchange",
  "Win32_System_Memory",
  "Win32_System_Ole",
  "Win32_System_SystemServices",
  "Win32_UI_Shell",
  "Win32_UI_WindowsAndMessaging",
] }
windows-sys = { version = "0.61", features = [
  "Win32_Foundation",
  "Win32_System_JobObjects",
  "Win32_System_Threading",
] }

[profile.release]
opt-level = "s"
lto = "thin"
codegen-units = 16
strip = true
